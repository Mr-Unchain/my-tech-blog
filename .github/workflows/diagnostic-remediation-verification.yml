name: Diagnostic remediation verification
on:
  push:
    branches: [codex/fix-repository-diagnostics-20261116]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit details
        continue-on-error: true
        run: npm audit --json
      - name: Formatting details
        continue-on-error: true
        run: npm run format:check
      - name: Tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

name: Diagnostic remediation verification
on:
  push:
    branches: [codex/fix-repository-diagnostics-20261116]
concurrency:
  group: diagnostic-remediation-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit details
        continue-on-error: true
        run: npm audit --json
      - name: Formatting details
        continue-on-error: true
        run: npm run format:check
      - name: Tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Changed file formatting
        run: npx --no-install prettier --check src/lib/structured-data.ts tests/lib/structured-data.test.ts src/components/ArticleCard.astro src/layouts/BaseLayout.astro src/pages/index.astro 'src/pages/blog/[id].astro' 'src/pages/category/[categoryName].astro'
      - name: Rendered JSON-LD
        run: |
          npm run dev -- --port 4321 >/tmp/diagnostic-remediation-server.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JSONLD_CHECK'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:4321';
          let ready = false;
          for (let attempt = 0; attempt < 45; attempt++) {
            try { if ((await fetch(base)).ok) { ready = true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          assert(ready, 'Development server did not become ready');
          for (const [path, type] of [['/', 'Blog'], ['/blog/docker-intro-part1/', 'BlogPosting'], ['/category/IT/', 'CollectionPage']]) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200, path);
            const html = await response.text();
            const blocks = [...html.matchAll(/<script\b[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)];
            assert(blocks.length > 0, 'Missing JSON-LD on ' + path);
            const data = blocks.map(match => JSON.parse(match[1]));
            assert(data.some(item => item['@type'] === type), 'Missing schema type on ' + path);
            console.log('Verified JSON-LD:', path, blocks.length, 'valid block(s)');
          }
          JSONLD_CHECK

name: Dependency remediation verification
on:
  push:
    branches: [codex/security-dependencies-20261116]
permissions:
  contents: read
concurrency:
  group: dependency-remediation-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare dependency candidate
        continue-on-error: true
        run: |
          node --input-type=module <<'DEPENDENCY_CANDIDATE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const p = JSON.parse(fs.readFileSync('package.json','utf8'));
          Object.assign(p.dependencies, {
            '@astrojs/markdown-remark':'7.3.9', '@astrojs/react':'7.1.9', '@astrojs/sitemap':'3.7.5',
            '@astrojs/vercel':'11.0.22', sharp:'0.35.5', firebase:'13.3.0', vite:'8.3.8'
          });
          Object.assign(p.devDependencies, {
            astro:'7.4.12', '@astrojs/partytown':'2.1.9', vitest:'5.1.0',
            '@vitest/coverage-v8':'5.1.0', autoprefixer:'10.6.2'
          });
          delete p.devDependencies['@astrojs/tailwind'];
          delete p.devDependencies.vercel;
          p.engines = {...p.engines, node:'>=22.23.4 <23'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          const config='astro.config.mjs';
          fs.writeFileSync(config,fs.readFileSync(config,'utf8').replace(/^import tailwind from "@astrojs\/tailwind";\r?\n/m,'').replace(/^    tailwind\(\),\r?\n/m,''));
          const layout='src/layouts/BaseLayout.astro';
          fs.writeFileSync(layout,fs.readFileSync(layout,'utf8').replace('import "../styles/main.scss";','import "../styles/global.css";\nimport "../styles/main.scss";'));
          execFileSync('npm',['install','--ignore-scripts','--no-audit'],{stdio:'inherit'});
          const fix = execFileSync('npm',['audit','fix','--ignore-scripts'],{stdio:'pipe',encoding:'utf8'});
          console.log(fix);
          
          DEPENDENCY_CANDIDATE
      - name: Export candidate
        run: |
          node --input-type=module <<'EXPORT_CANDIDATE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const paths=execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          for(const path of paths){const content=fs.readFileSync(path,'utf8');const total=Math.ceil(content.length/12000);for(let index=0;index<total;index++)console.log('CODEX_CHUNK '+JSON.stringify({path,index,total,data:content.slice(index*12000,(index+1)*12000)}));}
          
          EXPORT_CANDIDATE
      - name: Audit details
        continue-on-error: true
        run: npm audit --json
      - name: Tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

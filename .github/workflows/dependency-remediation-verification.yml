name: Dependency remediation verification
on:
  push:
    branches: [codex/security-dependencies-20261116]
concurrency:
  group: dependency-remediation-verification
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - name: Audit details
        run: npm audit --json
      - name: Formatting details
        continue-on-error: true
        run: npm run format:check
      - name: Tests
        run: npm test -- --run
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Changed file formatting
        run: npx --no-install prettier --check src/lib/structured-data.ts tests/lib/structured-data.test.ts src/components/ArticleCard.astro src/layouts/BaseLayout.astro src/pages/index.astro 'src/pages/blog/[id].astro' 'src/pages/category/[categoryName].astro'
      - name: Install Chromium
        run: npx --no-install playwright install chromium
      - name: Browser and JSON-LD verification
        run: |
          ./node_modules/.bin/astro dev --host 127.0.0.1 --port 4322 >/tmp/dependency-remediation-server.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'BROWSER_CHECK'
          import assert from 'node:assert/strict';
          import { chromium } from '@playwright/test';
          const base = 'http://127.0.0.1:4322';
          let ready = false;
          for (let attempt=0; attempt<45; attempt++) {
            try { if ((await fetch(base)).ok) { ready=true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve,1000));
          }
          if (!ready) console.log((await import('node:fs')).readFileSync('/tmp/dependency-remediation-server.log','utf8'));
          assert(ready, 'Server unavailable');
          for (const [path, type] of [['/', 'Blog'], ['/blog/docker-intro-part1/', 'BlogPosting'], ['/category/IT/', 'CollectionPage']]) {
            const response = await fetch(base + path);
            assert.equal(response.status, 200, path);
            const html = await response.text();
            const blocks = [...html.matchAll(/<script\b[^>]*type="application\/ld\+json"[^>]*>([\s\S]*?)<\/script>/g)];
            assert(blocks.length > 0, 'Missing JSON-LD on ' + path);
            const data = blocks.map(match => JSON.parse(match[1]));
            assert(data.some(item => item['@type'] === type), 'Missing schema type on ' + path);
            console.log('Verified JSON-LD:', path, blocks.length, 'valid block(s)');
          }
          const browser = await chromium.launch({headless:true});
          try {
            for (const width of [1440,390]) {
              const page = await browser.newPage({viewport:{width,height:900}});
              const errors = [];
              let hmrConnected = false;
              page.on('websocket', socket => socket.on('framereceived', frame => { try { if (JSON.parse(frame.payload.toString()).type === 'connected') hmrConnected = true; } catch {} }));
              page.on('pageerror', error => errors.push(error.message));
              for (const path of ['/', '/blog/docker-intro-part1/', '/category/IT/']) {
                hmrConnected = false;
                const response = await page.goto(base+path,{waitUntil:'domcontentloaded'});
                assert.equal(response.status(),200,path);
                await page.locator('h1').first().waitFor();
                for (let attempt=0; attempt<30 && !hmrConnected; attempt++) await new Promise(resolve => setTimeout(resolve,100));
                assert(hmrConnected, 'Development HMR connection did not open');
                const style = await page.evaluate(() => {
                  const probe=document.createElement('div'); probe.className='relative'; document.body.append(probe);
                  const result={position:getComputedStyle(probe).position,margin:getComputedStyle(document.body).margin,boxSizing:getComputedStyle(document.body).boxSizing,overflow:document.documentElement.scrollWidth-window.innerWidth};
                  probe.remove(); return result;
                });
                assert.equal(style.position,'relative','Tailwind utilities missing');
                assert.equal(style.margin,'0px','Tailwind base missing');
                assert.equal(style.boxSizing,'border-box','Tailwind box sizing missing');
                assert(style.overflow<=1,'Horizontal overflow: '+JSON.stringify(style));
                console.log('Browser verified:',width,path,JSON.stringify(style));
              }
              assert.deepEqual(errors,[],'Client JavaScript errors');
              await page.close();
            }
          } finally { await browser.close(); }
          BROWSER_CHECK

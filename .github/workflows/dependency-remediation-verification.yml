name: Dependency remediation verification
on:
  push:
    branches: [codex/security-dependencies-20261116]
permissions:
  contents: read
concurrency:
  group: dependency-remediation-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - name: Dependency compatibility metadata
        run: |
          node --input-type=module <<'METADATA_SCRIPT'
          import { execFileSync } from 'node:child_process';
          for (const name of ['astro','@astrojs/react','@astrojs/vercel','@astrojs/sitemap','@astrojs/partytown','@astrojs/markdown-remark','vitest','@vitest/coverage-v8','sharp','firebase','vite','tailwindcss','autoprefixer']) {
            const meta = JSON.parse(execFileSync('npm',['view',name+'@latest','version','engines','peerDependencies','--json'],{encoding:'utf8'}));
            console.log('PACKAGE_METADATA '+JSON.stringify({name,...meta}));
          }
          for (const text of ['vercel','@swup/scripts-plugin','@uiw/react-md-editor']) {
            try { console.log('PACKAGE_USAGE '+text+' '+execFileSync('git',['grep','-l','-F',text,'--','src','scripts','tests','.github'],{encoding:'utf8'})); } catch {console.log('PACKAGE_USAGE '+text+' no source references');}
          }
          
          METADATA_SCRIPT

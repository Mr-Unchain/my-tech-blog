name: Repository diagnostics

on:
  schedule:
    # 09:00 every Monday in Asia/Tokyo (UTC+9).
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnose repository health
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository diagnostics
        id: diagnostics
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node .codex/skills/diagnose-repository/scripts/run-diagnostics.mjs | tee repository-diagnostics.json

      - name: Add result to job summary
        if: always()
        shell: bash
        run: |
          echo '## Repository diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Full machine-readable output is available in the repository-diagnostics artifact.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          if [ -f repository-diagnostics.json ]; then
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync('repository-diagnostics.json','utf8')); console.log('Overall status: **'+r.overall+'**'); for (const c of r.results) console.log('- '+c.name+': '+c.status+' ('+c.durationMs+' ms)');" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Overall status: **inconclusive** (the diagnostics process produced no report)' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload diagnostic report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repository-diagnostics
          path: repository-diagnostics.json
          if-no-files-found: warn
          retention-days: 30

      - name: Fail unhealthy run
        if: steps.diagnostics.outcome == 'failure'
        run: exit 1
